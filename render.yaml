services:
  - type: web
    name: annseva
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: annseva-db
          property: connectionString
      - key: USE_SQLITE_FALLBACK
        value: "True"

databases:
  - name: annseva-db
    databaseName: annseva
    user: annseva